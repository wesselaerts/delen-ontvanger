<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Delen</title>
<!-- Chromecast-ontvanger voor Delen: toont het scherm van een tablet op de tv. De tablet stuurt elk nieuw
     schermbeeld als JPEG in stukken over de Cast-verbinding (kanaal urn:x-cast:nl.wesselaerts.delen). Deze
     pagina zet het pas neer als het hele beeld binnen en geladen is: geen laadscherm, geen flikkeren. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #ffffff; }
  #wacht { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           font: 600 42px/1.3 system-ui, sans-serif; color: #444; }
</style>
</head>
<body>
<img id="a" alt=""><img id="b" alt="" style="visibility:hidden">
<div id="wacht">Wacht op de tablet …</div>
<script>
  const NS = 'urn:x-cast:nl.wesselaerts.delen';
  const ctx = cast.framework.CastReceiverContext.getInstance();
  let zichtbaar = document.getElementById('a'), verborgen = document.getElementById('b');
  let getoond = -1;              // nummer van het beeld dat er nu staat
  const stukken = {};            // nummer -> {k, d: []}

  function toon(n, data) {
    if (n <= getoond) return;    // een ouder beeld dat later binnenkwam
    const img = verborgen;
    img.onload = () => {
      if (n <= getoond) return;
      img.style.visibility = 'visible';
      zichtbaar.style.visibility = 'hidden';
      verborgen = zichtbaar; zichtbaar = img; getoond = n;
      document.getElementById('wacht').style.display = 'none';
    };
    img.src = 'data:image/jpeg;base64,' + data;
  }

  ctx.addCustomMessageListener(NS, (e) => {
    const m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (!m || m.type !== 'BEELD') return;
    if (m.n <= getoond) return;
    const s = stukken[m.n] || (stukken[m.n] = { k: m.k, d: new Array(m.k), binnen: 0 });
    if (s.d[m.i] === undefined) { s.d[m.i] = m.d; s.binnen++; }
    if (s.binnen === s.k) {
      delete stukken[m.n];
      for (const oud of Object.keys(stukken)) if (+oud < m.n) delete stukken[oud];
      toon(m.n, s.d.join(''));
    }
  });

  const opties = new cast.framework.CastReceiverOptions();
  opties.disableIdleTimeout = true;      // blijft staan, ook als er een tijd niets verandert
  opties.skipPlayersLoad = true;         // geen videospeler nodig
  opties.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  ctx.start(opties);
</script>
</body>
</html>
